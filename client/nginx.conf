server {
    listen 80;

    client_max_body_size 500m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-javascript
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Hashed Vite assets can be cached aggressively; filenames change on each build.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Service worker files must not be cached so updates are picked up immediately.
    location ~* /(sw\.js|registerSW\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # The web app manifest can change when install metadata/icons change.
    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # App shell HTML should always be revalidated; static chunks carry long-lived cache headers above.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Proxy API requests to the server container.
    location /api {
        proxy_pass http://azure-server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.io.
    location /socket.io {
        proxy_pass http://azure-server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
