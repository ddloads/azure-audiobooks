services:
  # PostgreSQL next to the server, so queries don't cross the internet. Data
  # lives in a Docker volume on the host's local disk (never on the NAS share).
  # See docs/local-database.md for moving an existing Supabase database here.
  azure-db:
    image: postgres:17-alpine
    container_name: azure-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=azure
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack environment}
      - POSTGRES_DB=azure
    volumes:
      - azure-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azure -d azure"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - azure-network

  azure-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: azure-server
    restart: unless-stopped
    depends_on:
      azure-db:
        condition: service_healthy
    environment:
      # Defaults to the azure-db service. Setting DATABASE_URL / DIRECT_URL in
      # the stack environment overrides this (e.g. an external database).
      - DATABASE_URL=${DATABASE_URL:-postgresql://azure:${POSTGRES_PASSWORD}@azure-db:5432/azure}
      - DIRECT_URL=${DIRECT_URL:-postgresql://azure:${POSTGRES_PASSWORD}@azure-db:5432/azure}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:8080}
      - PORT=4000
      # Optional tuning. Stack variables only reach the container when listed
      # here; an empty value means the server's built-in default.
      - FAST_START_ENABLED=${FAST_START_ENABLED:-}
      - FAST_START_CONCURRENCY=${FAST_START_CONCURRENCY:-}
      - SCAN_WORKER_POOL_SIZE=${SCAN_WORKER_POOL_SIZE:-}
      - SCAN_FOLDER_CONCURRENCY=${SCAN_FOLDER_CONCURRENCY:-}
      - SCAN_PROBE_CONCURRENCY=${SCAN_PROBE_CONCURRENCY:-}
      - WATCH_FOLDERS_ENABLED=${WATCH_FOLDERS_ENABLED:-}
      - WATCH_FOLDER_POLL_INTERVAL_MS=${WATCH_FOLDER_POLL_INTERVAL_MS:-}
      - REQUIRE_LIBRARY_SENTINEL=${REQUIRE_LIBRARY_SENTINEL:-}
      - ALLOW_MASS_BOOK_REMOVAL=${ALLOW_MASS_BOOK_REMOVAL:-}
    ports:
      - "4000:4000"
    volumes:
      # Backups, logs and Audible profiles. In Portainer, set AZURE_DATA_PATH to
      # a fixed host folder: the default lives inside the stack's own folder,
      # which is lost when the stack is deleted or recreated.
      - ${AZURE_DATA_PATH:-./server/data}:/app/data
      # Bind-mount a subpath of the host-level Unraid /data mount (see
      # docs/homelab-storage-setup.md). Long syntax with create_host_path: false
      # makes the container refuse to start when the share isn't mounted,
      # instead of Docker creating an empty folder and the server serving an
      # empty library.
      - type: bind
        source: ${AUDIOBOOKS_PATH:-/mnt/unraid/data/media/audiobooks}
        target: /app/library
        bind:
          create_host_path: false
    networks:
      - azure-network

  azure-client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: azure-client
    restart: unless-stopped
    ports:
      - "${PORT_CLIENT:-8080}:80"
    depends_on:
      - azure-server
    networks:
      - azure-network

networks:
  azure-network:
    driver: bridge

volumes:
  azure-db-data:
