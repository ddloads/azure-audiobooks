services:
  azure-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: azure-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:8080}
      - PORT=4000
    ports:
      - "4000:4000"
    volumes:
      - ./server/data:/app/data
      # Bind-mount a subpath of the host-level Unraid /data mount (see
      # docs/audiobooks-nfs-hostmount-setup.md). Mounting via the host instead of
      # a per-container Docker NFS volume avoids the redeploy re-stat that hit
      # stale NFS handles (ESTALE) on the Unraid shfs user share. Container runs
      # as root; the export is all_squash so writes land as 99:100 regardless.
      - /mnt/unraid/data/media/audiobooks:/app/library
    networks:
      - azure-network

  azure-client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: azure-client
    restart: unless-stopped
    ports:
      - "${PORT_CLIENT:-8080}:80"
    depends_on:
      - azure-server
    networks:
      - azure-network

networks:
  azure-network:
    driver: bridge
