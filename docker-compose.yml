services:
  azure-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: azure-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:8080}
      - PORT=4000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - ./server/data:/app/data
      - Audiobooks:/app/library
    networks:
      - azure-network

  azure-client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: azure-client
    restart: unless-stopped
    ports:
      - "${PORT_CLIENT:-8080}:80"
    depends_on:
      azure-server:
        condition: service_healthy
    networks:
      - azure-network

networks:
  azure-network:
    driver: bridge

volumes:
  Audiobooks:
    external: true
