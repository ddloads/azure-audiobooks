services:
  azure-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: azure-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:8080}
      - PORT=4000
    ports:
      - "4000:4000"
    volumes:
      - ./server/data:/app/data
      # Bind-mount a subpath of the host-level Unraid /data mount (see
      # docs/homelab-storage-setup.md). Long syntax with create_host_path: false
      # makes the container refuse to start when the share isn't mounted,
      # instead of Docker creating an empty folder and the server serving an
      # empty library.
      - type: bind
        source: ${AUDIOBOOKS_PATH:-/mnt/unraid/data/media/audiobooks}
        target: /app/library
        bind:
          create_host_path: false
    networks:
      - azure-network

  azure-client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: azure-client
    restart: unless-stopped
    ports:
      - "${PORT_CLIENT:-8080}:80"
    depends_on:
      - azure-server
    networks:
      - azure-network

networks:
  azure-network:
    driver: bridge
